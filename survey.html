<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TREEBRICK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400&family=DM+Mono:wght@300;400&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #F7F2EC;
      color: #3A3D40;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    /* ── Three-dot nav ── */
    .nav {
      position: fixed;
      top: 28px;
      right: 32px;
      z-index: 100;
    }
    .nav-toggle {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px 8px;
      line-height: 1;
      color: #3A3D40;
      font-size: 1.25rem;
      letter-spacing: 0.05em;
      opacity: 0.55;
      transition: opacity 0.15s;
    }
    .nav-toggle:hover { opacity: 1; }
    .nav-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: #F7F2EC;
      border: 1px solid #3A3D4033;
      padding: 6px 0;
      min-width: 130px;
    }
    .nav-menu.open { display: block; }
    .nav-menu a {
      display: block;
      padding: 9px 20px;
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #3A3D40;
      text-decoration: none;
      transition: background 0.1s;
    }
    .nav-menu a:hover { background: #3A3D400a; }

    /* ── Page layout ── */
    .page {
      max-width: 860px;
      margin: 0 auto;
      padding: 80px 40px 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .title-block {
      width: 100%;
      margin-bottom: 60px;
    }
    h1 {
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1;
      text-transform: uppercase;
      color: #3A3D40;
      margin-bottom: 18px;
    }
    .rule {
      width: 100%;
      border: none;
      border-top: 1px solid #3A3D4044;
      margin: 0;
    }
    .text-block {
      max-width: 560px;
      margin: 48px auto 0;
      font-size: clamp(0.9rem, 2.5vw, 1rem);
      font-weight: 300;
      line-height: 1.9;
      letter-spacing: 0.02em;
      color: #4A4E52;
      text-align: left;
    }
    .figures {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
      margin: 48px auto 0;
    }
    .figures img {
      width: 100%;
      height: auto;
      display: block;
    }
    .footer-rule {
      width: 100%;
      border: none;
      border-top: 1px solid #3A3D4044;
      margin-top: 80px;
    }
    @media (max-width: 600px) {
      .page { padding: 50px 24px 70px; }
      .nav { top: 20px; right: 20px; }
    }
  </style>
</head>
<body>

  <!-- Three-dot menu -->
  <nav class="nav" id="nav">
    <button class="nav-toggle" id="nav-toggle" aria-label="Open menu" aria-expanded="false">···</button>
    <div class="nav-menu" id="nav-menu" role="menu">
      <a href="index.html" role="menuitem">Home</a>
      <a href="index.html#about" role="menuitem">About</a>
      <a href="survey.html" role="menuitem">Survey</a>
    </div>
  </nav>

  <div class="page">
    <div class="title-block">
      <h1>TREEBRICK</h1>
    </div>
    <hr class="rule" />
    <div class="text-block">
      <p>Take this <a href="https://forms.gle/crNcu41gWzKPFD8C6" target="_blank" style="color: inherit;">survey</a> to share your thoughts on treebrick.
        The treebrick survey is often used by local, state, and federal lawmakers when making key policy decisions. Make sure your voice is heard!</p>
    </div>
    <div class="figures">
      <img src="graph1.png" alt="Graph 1" />
      <img src="graph2.png" alt="Graph 2" />
      <img src="graph3.png" alt="Graph 3" />
    </div>
    <hr class="footer-rule" />
    <p style="font-family: 'DM Mono', monospace; font-size: 0.6rem; font-weight: 300; letter-spacing: 0.1em; color: #6A6E72; margin-top: 40px;">
      <a href="https://www.instagram.com/matttarduno/" target="_blank" rel="noopener noreferrer" style="color: inherit; text-decoration: none;">@matttarduno</a>
    </p>
  </div>

  <script>
    const toggle = document.getElementById('nav-toggle');
    const menu   = document.getElementById('nav-menu');

    toggle.addEventListener('click', function(e) {
      e.stopPropagation();
      const isOpen = menu.classList.toggle('open');
      toggle.setAttribute('aria-expanded', isOpen);
    });

    document.addEventListener('click', function() {
      menu.classList.remove('open');
      toggle.setAttribute('aria-expanded', false);
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        menu.classList.remove('open');
        toggle.setAttribute('aria-expanded', false);
      }
    });
  </script>

<script data-goatcounter="https://treebrick.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
